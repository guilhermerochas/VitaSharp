# Publishes a GitHub Release with the packages of every platform (see "Releases" in README.md).
#   - push a tag v<version>:  git tag v0.1.0 && git push origin v0.1.0
#   - or run it from the Actions tab (Run workflow) with a version; the tag v<version> is then created on the chosen
#     branch's commit when the release is published.
#   - automatic builds: every push to main whose CI run passed (tests and packages) publishes the packages of that run
#     as the prerelease "VitaSharp <version>+<commit>" (tag build-<commit>) without building them again; only the
#     newest KEEP_BUILDS automatic releases are kept.
# A version with a suffix (0.2.0-alpha, 0.2.0-dev.1) or the "prerelease" checkbox makes a prerelease. The packages come
# from the CI workflow (tests first, then the Native AOT packages of win-x64, linux-x64 and osx-arm64) built with the
# version, which also becomes the app's version ("VitaSharp 0.1.0+<commit>" in the log).
name: Release

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0 or 0.2.0-alpha (the tag is v<version>)
        required: true
        type: string
      prerelease:
        description: Mark as a prerelease (versions with a suffix always are)
        type: boolean
        default: false

# read-only for everything except the release job below
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # automatic (build-*) releases kept on the Releases page; older ones and their tags are deleted
  KEEP_BUILDS: 10

jobs:
  prepare:
    name: Version
    # automatic builds: only a CI run of a push to main that passed (a failed or cancelled run publishes nothing)
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      automatic: ${{ steps.version.outputs.automatic }}
      commit: ${{ steps.version.outputs.commit }}
      source_version: ${{ steps.version.outputs.source_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # the v* tags: the base version of an automatic build, the tag check of manual runs
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          short="$(git rev-parse --short=7 "$COMMIT")"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            # the last v* release before this commit (0.0.0 before the first one) plus -build.g<commit>: a valid
            # prerelease version that sorts below the next v* release
            base="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$COMMIT" 2>/dev/null || true)"
            base="${base#v}"; base="${base%%-*}"; [ -n "$base" ] || base=0.0.0
            {
              echo "version=$base-build.g$short"; echo "tag=build-$short"; echo "title=VitaSharp $base+$short"
              echo "prerelease=true"; echo "automatic=true"; echo "commit=$COMMIT"
              # the CI run named its packages VitaSharp-ci-<run number>-<rid>.<ext>
              echo "source_version=ci-$CI_RUN_NUMBER"
            } >> "$GITHUB_OUTPUT"
            echo "Automatic build release build-$short (VitaSharp $base+$short) from CI run $CI_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then v="${REF_NAME#v}"; else v="${INPUT_VERSION#v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$v' is not a release version: use 1.2.3 or 1.2.3-suffix (tag v1.2.3)"; exit 1
          fi
          pre=false
          if [[ "$v" == *-* ]] || [ "$INPUT_PRERELEASE" = true ]; then pre=true; fi
          {
            echo "version=$v"; echo "tag=v$v"; echo "title=VitaSharp $v"; echo "prerelease=$pre"; echo "automatic=false"
            echo "commit=$COMMIT"; echo "source_version=$v"
          } >> "$GITHUB_OUTPUT"
          echo "Release v$v (prerelease: $pre)" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # an existing tag must already point at the commit being built (e.g. re-running a release)
          refs="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          existing="$(grep -F "refs/tags/$TAG^{}" <<< "$refs" | cut -f1 || true)"
          [ -n "$existing" ] || existing="$(cut -f1 <<< "$refs" | head -n1)"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::tag $TAG already exists on $existing, not on $GITHUB_SHA"; exit 1
          fi

  # tags and manual runs build the packages with the release version; automatic builds reuse the CI run's packages
  build:
    name: Build
    needs: prepare
    if: needs.prepare.outputs.automatic != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  release:
    name: Publish release
    needs: [prepare, build]
    # the build job is skipped for automatic builds
    if: always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read # the artifacts of the CI run (automatic builds)
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      AUTOMATIC: ${{ needs.prepare.outputs.automatic }}
      # the version in the packages' file names; packages named with another one are renamed to VERSION
      SOURCE_VERSION: ${{ needs.prepare.outputs.source_version }}
      CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0 # the whole history and its tags, for the commit list since the previous release

      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.automatic != 'true'
        with:
          pattern: VitaSharp-*-packages
          path: packages

      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.automatic == 'true'
        with:
          pattern: VitaSharp-*-packages
          path: packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # one artifact per platform, VitaSharp-aot-<rid>-packages (a future VitaSharp-<rid>-packages, such as the
      # Android APK, is collected the same way); every file must be VitaSharp-<version>-<rid>.<ext> or -setup.exe
      - name: Collect the packages
        run: |
          mkdir -p release
          for dir in packages/*/; do
            name="$(basename "$dir")"; rid="${name%-packages}"; rid="${rid#VitaSharp-}"; rid="${rid#aot-}"
            prefix="VitaSharp-$VERSION-$rid"
            for f in "$dir"*; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              # automatic builds: VitaSharp-ci-<n>-<rid>.<ext> of the CI run becomes VitaSharp-<version>-<rid>.<ext>
              if [ "$SOURCE_VERSION" != "$VERSION" ] && [[ "$base" == "VitaSharp-$SOURCE_VERSION-"* ]]; then
                base="VitaSharp-$VERSION-${base#"VitaSharp-$SOURCE_VERSION-"}"
              fi
              case "${base#"$prefix"}" in
                .zip|-setup.exe|.tar.gz|.AppImage|.app.zip|.dmg|.apk) ;;
                *) echo "::error::unexpected file $base in $name (expected $prefix.<zip|tar.gz|AppImage|app.zip|dmg|apk> or $prefix-setup.exe)"; exit 1 ;;
              esac
              if [ -e "release/$base" ]; then echo "::error::two packages named $base"; exit 1; fi
              mv "$f" "release/$base"
            done
          done
          [ -n "$(ls -A release)" ] || { echo "::error::no packages were built"; exit 1; }
          for want in win-x64.zip win-x64-setup.exe linux-x64.tar.gz linux-x64.AppImage osx-arm64.app.zip osx-arm64.dmg; do
            [ -f "release/VitaSharp-$VERSION-$want" ] || { echo "::error::missing package VitaSharp-$VERSION-$want"; exit 1; }
          done
          ls -l release

      # never publish Sony firmware: no .PUP file, and no .PUP or installed firmware partition inside the archives (the
      # installers, AppImages and dmgs are made from the same folders as the zips and tar.gz files)
      - name: Check that no firmware is included
        run: |
          shopt -s nocasematch
          bad='(\.pup$|(^|/)(os0|vs0|sa0|pd0)/)'
          for f in release/*; do
            if [[ "$f" =~ \.pup$ ]]; then echo "::error::firmware file $f"; exit 1; fi
            case "$f" in
              *.zip) list="$(unzip -Z1 "$f")" ;;
              *.tar.gz) list="$(tar -tzf "$f")" ;;
              *) continue ;;
            esac
            if grep -qiE "$bad" <<< "$list"; then
              echo "::error::$f contains firmware:"; grep -iE "$bad" <<< "$list" | head; exit 1
            fi
          done

      - name: Checksums
        run: |
          cd release
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      # header (build/release-notes-header.md) + the commits since the previous v* tag; automatic builds list the
      # commits since the previous release of either kind (build-* or v*)
      - name: Release notes
        run: |
          if [ "$AUTOMATIC" = true ]; then match=(--match 'v*' --match 'build-*'); else match=(--match 'v*'); fi
          prev="$(git describe --tags --abbrev=0 "${match[@]}" --exclude "$TAG" "$COMMIT" 2>/dev/null || true)"
          if [ -n "$prev" ]; then range="$prev..$COMMIT"; else range="$COMMIT"; fi
          count="$(git rev-list --no-merges --count "$range")"
          max=300
          {
            if [ "$AUTOMATIC" = true ]; then
              echo "Automatic build of \`main\` at $COMMIT, published when its [CI run]($CI_RUN_URL) passed (tests and packages)."
              echo "Not a release: the \`v*\` releases are the versioned ones."
              echo
            fi
            cat build/release-notes-header.md
            echo
            if [ -n "$prev" ]; then echo "## Changes since $prev"; else echo "## Changes"; fi
            echo
            git log --no-merges --pretty='format:- %s (%h)' -n "$max" "$range"
            echo
            if [ "$count" -gt "$max" ]; then echo "- ... and $((count - max)) earlier commits"; fi
            echo
            if [ -n "$prev" ]; then
              echo "**Full changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$prev...$TAG"
            else
              echo "First release."
            fi
          } > release-notes.md
          cat release-notes.md

      # a tag created here by the GITHUB_TOKEN does not start this workflow (or CI) again
      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ env.COMMIT }}
          name: ${{ needs.prepare.outputs.title }}
          body_path: release-notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: release/*
          fail_on_unmatched_files: true

      # only the newest KEEP_BUILDS automatic releases stay; the v* releases are never touched
      - name: Delete old automatic releases
        if: needs.prepare.outputs.automatic == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"build-\"))] | sort_by(.createdAt) | reverse | .[$KEEP_BUILDS:] | .[].tagName" |
          while read -r old; do
            echo "deleting the automatic release $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
