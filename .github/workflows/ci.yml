name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # .github/workflows/release.yml calls this workflow to build the release packages (tests included) with the release version
  workflow_call:
    inputs:
      version:
        description: Package and app version (1.2.3 or 1.2.3-suffix); empty for ci-<run number>
        type: string
        default: ''

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # names the packages; a release version also becomes the app's version (see build/publish.sh)
  PACKAGE_VERSION: ${{ inputs.version || format('ci-{0}', github.run_number) }}

jobs:
  # Script parity job disabled (user decision, 12/11/2026): run build/check-script-parity.sh / .ps1 locally
  # (build/prepush-check runs it). Uncomment the block below to bring the CI check back.
  # script-parity:
  #   name: Script parity (.ps1 and .sh)
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 5
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Every script has a Windows and a Linux/macOS version
  #       run: bash build/check-script-parity.sh

  # Code style job disabled for now (user decision, 11/11/2026): run build/format-check.sh / .ps1 locally.
  # Uncomment the block below to bring the CI check back.
  # # C# code style (.editorconfig, the Ryujinx/Ryubing style): layout and the :warning rules, through build/format-check.sh
  # # (the same check developers run locally); folders in build/format-pending.txt are skipped until converted.
  # code-style:
  #   name: Code style (dotnet format)
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 20
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-dotnet@v4
  #       with:
  #         dotnet-version: '10.0.x'
  #     - uses: actions/cache@v4
  #       with:
  #         path: third_party/ffmpeg
  #         key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/FFmpeg.targets') }}
  #     - name: Restore
  #       run: dotnet restore VitaSharp.sln
  #     - name: dotnet format --verify-no-changes
  #       run: bash build/format-check.sh

  # Shell scripts: ShellCheck clean (Google Shell Style Guide), and every build/*.sh at least
  # parses and answers --help on macOS (bash 3.2 and the BSD tools, the platform most likely to break them).
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=style

  scripts-macos:
    name: Scripts on macOS (bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Every script parses and prints its usage
        run: /bin/bash build/check-scripts-help.sh   # the system bash 3.2, not a newer one on PATH

  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # FFmpeg shared libraries downloaded by build/FFmpeg.targets (none on macOS: it uses the system FFmpeg)
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/FFmpeg.targets') }}

      # a Vulkan device for the renderer tests (tests/VitaSharp.Tests/SoftwareVulkan.cs): Mesa's lavapipe on Linux,
      # MoltenVK on macOS; the Windows runner's Microsoft Edge ships SwiftShader. Linux also gets the distribution's
      # shaderc (libshaderc-dev: libshaderc_shared.so, the name Silk.NET.Shaderc loads), which the renderer and
      # ShaderFuzzTests fall back to when the copy from Silk.NET.Shaderc.Native does not load on the runner
      - name: Install a software Vulkan device and shaderc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libshaderc-dev
      - name: Install MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: brew install molten-vk vulkan-loader
      # the window test's child process reaches SwiftShader through the system Vulkan loader (its window surface),
      # and the loader ignores VK_DRIVER_FILES in an elevated process (the runner's): register Edge's manifest instead
      # (the runner has no HKLM\SOFTWARE\Khronos key at all: -Force makes New-Item create the whole path); vulkaninfo,
      # when the image has it, lists what the loader finds without VK_DRIVER_FILES
      - name: Register SwiftShader with the Vulkan loader (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\*\vk_swiftshader.dll" |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $icd = if ($dll) { Join-Path $dll.DirectoryName 'vk_swiftshader_icd.json' }
          if (-not $icd -or -not (Test-Path $icd)) { Write-Error 'no vk_swiftshader_icd.json next to Microsoft Edge'; exit 1 }
          $key = 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers'
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
          New-ItemProperty -Path $key -Name $icd -PropertyType DWord -Value 0 -Force | Out-Null
          if ((Get-ItemProperty -Path $key -Name $icd -ErrorAction Stop).$icd -ne 0) { Write-Error "$icd is not registered as 0 under $key"; exit 1 }
          "registered $icd under $key"
          if (Get-Command vulkaninfo -ErrorAction SilentlyContinue) {
            & { $ErrorActionPreference = 'Continue'; vulkaninfo --summary 2>&1 | Out-String }
            "vulkaninfo exit $LASTEXITCODE"
            $global:LASTEXITCODE = 0
          }

      - name: Restore
        run: dotnet restore VitaSharp.sln

      - name: Build
        run: dotnet build VitaSharp.sln -c Release --no-restore

      # Long CPU fuzz/differential runs (Category=Slow, 15-45 min) are skipped here; run them locally with
      # `dotnet test tests/VitaSharp.Tests --filter Category=Slow`.
      # When the test host crashes the run is otherwise just "aborted", so every run leaves enough to find out where:
      # - --blame-crash: the Sequence_*.xml of started tests and a minidump of the crashed host (createdump);
      # - --diag: the vstest/testhost logs, including the host's stderr (the runtime's fatal-error stack trace);
      # - console verbosity=normal: every finished test in the log, so the last ones before the abort are visible.
      # All of it lands in test-results, uploaded below.
      - name: Test
        shell: bash
        run: >
          dotnet test tests/VitaSharp.Tests -c Release --no-build --filter "Category!=Slow"
          --blame-crash --blame-crash-dump-type mini --blame-hang --blame-hang-timeout 20m --blame-hang-dump-type none
          --diag test-results/diag/vstest.log
          --logger "console;verbosity=normal" --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results

  # Line coverage of the Category!=Slow suite (build/coverage.ps1) against the minimums in build/coverage-gate.txt: the
  # job fails when the overall coverage or an assembly's drops below its minimum. Windows, where the measured values
  # come from: the runner's Microsoft Edge ships SwiftShader, the software Vulkan device the renderer tests use.
  coverage:
    name: Coverage gate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/FFmpeg.targets') }}
      # as in build-test: the window test's child process gets SwiftShader through the system loader
      - name: Register SwiftShader with the Vulkan loader
        shell: pwsh
        run: |
          $dll = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\*\vk_swiftshader.dll" |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $icd = if ($dll) { Join-Path $dll.DirectoryName 'vk_swiftshader_icd.json' }
          if (-not $icd -or -not (Test-Path $icd)) { Write-Error 'no vk_swiftshader_icd.json next to Microsoft Edge'; exit 1 }
          $key = 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers'
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
          New-ItemProperty -Path $key -Name $icd -PropertyType DWord -Value 0 -Force | Out-Null
          if ((Get-ItemProperty -Path $key -Name $icd -ErrorAction Stop).$icd -ne 0) { Write-Error "$icd is not registered as 0 under $key"; exit 1 }
          "registered $icd under $key"
          if (Get-Command vulkaninfo -ErrorAction SilentlyContinue) {
            & { $ErrorActionPreference = 'Continue'; vulkaninfo --summary 2>&1 | Out-String }
            "vulkaninfo exit $LASTEXITCODE"
            $global:LASTEXITCODE = 0
          }
      - name: Coverage and gate
        shell: pwsh
        run: ./build/coverage.ps1 coverage --gate
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report

  # The packages: Native AOT only, for win-x64, linux-x64 and osx-arm64 (ReadyToRun builds and the other platforms are
  # still available locally through build/publish.sh / build/publish.ps1). Native AOT cannot cross-compile between
  # operating systems, so every platform is built on its own runner: MSVC (preinstalled on windows-latest), clang +
  # zlib on Linux, Xcode command-line tools on macOS.
  publish-aot:
    name: Publish Native AOT (${{ matrix.rid }})
    needs: build-test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-publish-${{ matrix.rid }}-${{ hashFiles('build/FFmpeg.targets') }}
      - name: Install Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      # Windows: AOT build, zip and Inno Setup installer (installed with Chocolatey when the runner image lacks it)
      - name: Publish and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $found = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or (Test-Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe") -or (Test-Path "$env:ProgramFiles\Inno Setup *\ISCC.exe")
          if (-not $found) { choco install innosetup -y --no-progress }
          ./build/publish.ps1 -Aot -Package -Rid ${{ matrix.rid }} -Out artifacts/publish -Version $env:PACKAGE_VERSION
      # Linux: tar.gz + AppImage; macOS: .app zip + dmg
      - name: Publish and package
        if: runner.os != 'Windows'
        shell: bash
        run: OUT=artifacts/publish VERSION="$PACKAGE_VERSION" bash build/publish.sh --aot --package ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSharp-aot-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSharp-aot-${{ matrix.rid }}-packages
          path: artifacts/publish/packages
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSharp-aot-${{ matrix.rid }}-symbols
          path: artifacts/publish/${{ matrix.rid }}-symbols
          if-no-files-found: ignore

  # The Android app (src/VitaSharp.Android): the Release APK for arm64 phones, Native AOT (the project's Release
  # default), built and checked by build/build-android-apk.sh, the script developers run locally too (the check fails
  # without lib/arm64-v8a/libshaderc_shared.so, libadrenotools and its hooks, or with a Mono/CoreCLR runtime inside).
  # ubuntu-latest: the image has the Android SDK (sdkmanager, ANDROID_HOME writable by the runner) and bash for the
  # ndk-build scripts, its runners are the fastest, and .NET for Android builds Native AOT from a Linux host. The APK
  # is signed with the keystore in the ANDROID_KEYSTORE_BASE64 secret (password ANDROID_KEYSTORE_PASS, key
  # ANDROID_KEY_ALIAS; docs/android/README.md, "Signing"), so every APK updates the last one in place and the phone keeps
  # its data; a fork without the secret signs with a debug keystore made on the fly (a new key each run: installing it
  # over another build needs an uninstall, which deletes the app's data). Installable with adb, not a store release. Caches: NuGet packages, the NDK (about 2 GB) and the compiled libshaderc/libadrenotools
  # (third_party, keyed on their build files and the NDK version: the shaderc compile is the longest step). About
  # 15-20 min with warm caches, 25-35 min on a cold run.
  android-arm64:
    name: Publish Android APK (android-arm64, Native AOT)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # the NDK the project uses (docs/android/README.md, "Building")
      NDK_VERSION: '30.0.16248370'
    steps:
      - uses: actions/checkout@v4

      # .NET in the home folder: the workload install below then needs no sudo (the image's /usr/share/dotnet does)
      - name: Install .NET into the home folder
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: nuget-android-${{ runner.os }}-

      - name: Install the .NET Android workload
        run: dotnet workload install maui-android

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-ndk
          key: android-ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      # the SDK platform and build tools of the app (android-36), and the NDK when the cache did not have it; the
      # runner's own ANDROID_NDK_* point at another NDK, so both are set to this one
      - name: Install the Android SDK packages and the NDK
        shell: bash
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${sdkmanager}" --licenses > /dev/null || true
          "${sdkmanager}" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          ndk="${RUNNER_TEMP}/android-ndk/${NDK_VERSION}"
          if [[ ! -d "${ndk}/toolchains" ]]; then
            "${sdkmanager}" --install "ndk;${NDK_VERSION}" > /dev/null
            mkdir -p "${RUNNER_TEMP}/android-ndk"
            mv "${ANDROID_HOME}/ndk/${NDK_VERSION}" "${ndk}"
          fi
          echo "ANDROID_NDK_HOME=${ndk}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ndk}" >> "${GITHUB_ENV}"

      - uses: actions/cache@v4
        with:
          path: |
            third_party/android-shaderc/libs
            third_party/android-adrenotools/libs
          key: android-native-${{ env.NDK_VERSION }}-${{ hashFiles('build/android-shaderc/**', 'build/android-adrenotools/**', 'build/build-android-shaderc.sh', 'build/build-android-adrenotools.sh') }}

      - name: Build and check the APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" ]]; then
            export ANDROID_KEYSTORE="${RUNNER_TEMP}/vitasharp.keystore"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${ANDROID_KEYSTORE}"
          else
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: the APK gets a new debug key (it cannot update an installed build)"
          fi
          [[ -n "${ANDROID_KEYSTORE_PASS}" ]] || unset ANDROID_KEYSTORE_PASS
          [[ -n "${ANDROID_KEY_ALIAS}" ]] || unset ANDROID_KEY_ALIAS
          OUT=artifacts/android VERSION="$PACKAGE_VERSION" JOBS=4 bash build/build-android-apk.sh

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Publish Android APK (android-arm64, Native AOT)"
            echo
            for f in artifacts/android/packages/*.apk; do
              signer="$(keytool -printcert -jarfile "$f" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')"
              echo "- \`$(basename "$f")\`: $(wc -c < "$f" | tr -d ' ') bytes, runtime nativeaot, NDK ${NDK_VERSION}, signer SHA-256 ${signer}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # a VitaSharp-<rid>-packages artifact holding VitaSharp-<version>-android-arm64.apk: release.yml publishes it
      # with the desktop packages (the runtime is Native AOT, said in the summary above; the other runtimes,
      # mono-aot-llvm or coreclr, are local builds only)
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSharp-android-arm64-packages
          path: artifacts/android/packages
          compression-level: 0
          if-no-files-found: error
