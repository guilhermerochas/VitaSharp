name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # .github/workflows/release.yml calls this workflow to build the release packages (tests included) with the release version
  workflow_call:
    inputs:
      version:
        description: Package and app version (1.2.3 or 1.2.3-suffix); empty for ci-<run number>
        type: string
        default: ''

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # names the packages; a release version also becomes the app's version (see build/publish.sh)
  PACKAGE_VERSION: ${{ inputs.version || format('ci-{0}', github.run_number) }}

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # FFmpeg shared libraries downloaded by build/FFmpeg.targets (none on macOS: it uses the system FFmpeg)
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/FFmpeg.targets') }}

      - name: Restore
        run: dotnet restore VitaSharp.sln

      - name: Build
        run: dotnet build VitaSharp.sln -c Release --no-restore

      # Long CPU fuzz/differential runs (Category=Slow, 15-45 min) are skipped here; run them locally with
      # `dotnet test tests/VitaSharp.Tests --filter Category=Slow`.
      # When the test host crashes the run is otherwise just "aborted", so every run leaves enough to find out where:
      # - --blame-crash: the Sequence_*.xml of started tests and a minidump of the crashed host (createdump);
      # - --diag: the vstest/testhost logs, including the host's stderr (the runtime's fatal-error stack trace);
      # - console verbosity=normal: every finished test in the log, so the last ones before the abort are visible.
      # All of it lands in test-results, uploaded below.
      - name: Test
        shell: bash
        run: >
          dotnet test tests/VitaSharp.Tests -c Release --no-build --filter "Category!=Slow"
          --blame-crash --blame-crash-dump-type mini --blame-hang --blame-hang-timeout 20m --blame-hang-dump-type none
          --diag test-results/diag/vstest.log
          --logger "console;verbosity=normal" --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results

  # Self-contained single-file builds for every platform, cross-published and packaged from one Linux runner (the
  # macOS .app is unsigned; the Windows installer and the macOS .dmg come from the per-OS AOT jobs below).
  publish:
    name: Publish (${{ matrix.rid }})
    needs: build-test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-publish-${{ matrix.rid }}-${{ hashFiles('build/FFmpeg.targets') }}
      - name: Install appimagetool
        if: startsWith(matrix.rid, 'linux-')
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Publish and package
        run: OUT=artifacts/publish VERSION="$PACKAGE_VERSION" bash build/publish.sh --package ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSharp-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}
      # zip / tar.gz / AppImage / .app.zip made by build/publish.sh --package
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSharp-${{ matrix.rid }}-packages
          path: artifacts/publish/packages
          compression-level: 0 # already compressed

  # Native AOT builds. Native AOT cannot cross-compile between operating systems, so every platform is built on its
  # own runner: MSVC (preinstalled on windows-latest), clang + zlib on Linux, Xcode command-line tools on macOS.
  publish-aot:
    name: Publish Native AOT (${{ matrix.rid }})
    needs: build-test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest # Apple Silicon runner, cross-architecture AOT within macOS is supported
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-publish-${{ matrix.rid }}-${{ hashFiles('build/FFmpeg.targets') }}
      - name: Install Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      # Windows: AOT build, zip and Inno Setup installer (installed with Chocolatey when the runner image lacks it)
      - name: Publish and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $found = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or (Test-Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe") -or (Test-Path "$env:ProgramFiles\Inno Setup *\ISCC.exe")
          if (-not $found) { choco install innosetup -y --no-progress }
          ./build/publish.ps1 -Aot -Package -Rid ${{ matrix.rid }} -Out artifacts/publish -Version $env:PACKAGE_VERSION
      # Linux: tar.gz + AppImage; macOS: .app zip + dmg
      - name: Publish and package
        if: runner.os != 'Windows'
        shell: bash
        run: OUT=artifacts/publish VERSION="$PACKAGE_VERSION" bash build/publish.sh --aot --package ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSharp-aot-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSharp-aot-${{ matrix.rid }}-packages
          path: artifacts/publish/packages
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSharp-aot-${{ matrix.rid }}-symbols
          path: artifacts/publish/${{ matrix.rid }}-symbols
          if-no-files-found: ignore

  # Linux ARM64 Native AOT on GitHub's ARM64 runner (free for public repositories only; skipped for private ones,
  # where the job would otherwise wait for a runner that never comes).
  publish-aot-linux-arm64:
    name: Publish Native AOT (linux-arm64)
    needs: build-test
    if: github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-publish-linux-arm64-${{ hashFiles('build/FFmpeg.targets') }}
      - name: Install Native AOT prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Publish and package
        run: OUT=artifacts/publish VERSION="$PACKAGE_VERSION" bash build/publish.sh --aot --package linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSharp-aot-linux-arm64
          path: artifacts/publish/linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSharp-aot-linux-arm64-packages
          path: artifacts/publish/packages
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSharp-aot-linux-arm64-symbols
          path: artifacts/publish/linux-arm64-symbols
          if-no-files-found: ignore
