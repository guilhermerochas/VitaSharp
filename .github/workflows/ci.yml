name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # .github/workflows/release.yml calls this workflow to build the release packages (tests included) with the release version
  workflow_call:
    inputs:
      version:
        description: Package and app version (1.2.3 or 1.2.3-suffix); empty for ci-<run number>
        type: string
        default: ''

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # names the packages; a release version also becomes the app's version (see build/publish.sh)
  PACKAGE_VERSION: ${{ inputs.version || format('ci-{0}', github.run_number) }}

jobs:
  script-parity:
    name: Script parity (.ps1 and .sh)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every script has a Windows and a Linux/macOS version
        run: bash build/check-script-parity.sh

  # C# code style (.editorconfig, the Ryujinx/Ryubing style): layout and the :warning rules, through build/format-check.sh
  # (the same check developers run locally); folders in build/format-pending.txt are skipped until converted.
  code-style:
    name: Code style (dotnet format)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/FFmpeg.targets') }}
      - name: Restore
        run: dotnet restore VitaSharp.sln
      - name: dotnet format --verify-no-changes
        run: bash build/format-check.sh

  # Shell scripts: ShellCheck clean (Google Shell Style Guide, docs/agents/regras.md), and every build/*.sh at least
  # parses and answers --help on macOS (bash 3.2 and the BSD tools, the platform most likely to break them).
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=style

  scripts-macos:
    name: Scripts on macOS (bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Every script parses and prints its usage
        run: /bin/bash build/check-scripts-help.sh   # the system bash 3.2, not a newer one on PATH

  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # FFmpeg shared libraries downloaded by build/FFmpeg.targets (none on macOS: it uses the system FFmpeg)
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/FFmpeg.targets') }}

      # a Vulkan device for the renderer tests (tests/VitaSharp.Tests/SoftwareVulkan.cs): Mesa's lavapipe on Linux,
      # MoltenVK on macOS; the Windows runner's Microsoft Edge ships SwiftShader
      - name: Install a software Vulkan device (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: Install MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: brew install molten-vk vulkan-loader

      - name: Restore
        run: dotnet restore VitaSharp.sln

      - name: Build
        run: dotnet build VitaSharp.sln -c Release --no-restore

      # Long CPU fuzz/differential runs (Category=Slow, 15-45 min) are skipped here; run them locally with
      # `dotnet test tests/VitaSharp.Tests --filter Category=Slow`.
      # When the test host crashes the run is otherwise just "aborted", so every run leaves enough to find out where:
      # - --blame-crash: the Sequence_*.xml of started tests and a minidump of the crashed host (createdump);
      # - --diag: the vstest/testhost logs, including the host's stderr (the runtime's fatal-error stack trace);
      # - console verbosity=normal: every finished test in the log, so the last ones before the abort are visible.
      # All of it lands in test-results, uploaded below.
      - name: Test
        shell: bash
        run: >
          dotnet test tests/VitaSharp.Tests -c Release --no-build --filter "Category!=Slow"
          --blame-crash --blame-crash-dump-type mini --blame-hang --blame-hang-timeout 20m --blame-hang-dump-type none
          --diag test-results/diag/vstest.log
          --logger "console;verbosity=normal" --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results

  # Line coverage of the Category!=Slow suite (build/coverage.ps1) against the minimums in build/coverage-gate.txt: the
  # job fails when the overall coverage or an assembly's drops below its minimum. Windows, where the measured values
  # come from: the runner's Microsoft Edge ships SwiftShader, the software Vulkan device the renderer tests use.
  coverage:
    name: Coverage gate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/FFmpeg.targets') }}
      - name: Coverage and gate
        shell: pwsh
        run: ./build/coverage.ps1 coverage --gate
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report

  # The packages: Native AOT only, for win-x64, linux-x64 and osx-arm64 (ReadyToRun builds and the other platforms are
  # still available locally through build/publish.sh / build/publish.ps1). Native AOT cannot cross-compile between
  # operating systems, so every platform is built on its own runner: MSVC (preinstalled on windows-latest), clang +
  # zlib on Linux, Xcode command-line tools on macOS.
  publish-aot:
    name: Publish Native AOT (${{ matrix.rid }})
    needs: build-test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-publish-${{ matrix.rid }}-${{ hashFiles('build/FFmpeg.targets') }}
      - name: Install Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      # Windows: AOT build, zip and Inno Setup installer (installed with Chocolatey when the runner image lacks it)
      - name: Publish and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $found = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or (Test-Path "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe") -or (Test-Path "$env:ProgramFiles\Inno Setup *\ISCC.exe")
          if (-not $found) { choco install innosetup -y --no-progress }
          ./build/publish.ps1 -Aot -Package -Rid ${{ matrix.rid }} -Out artifacts/publish -Version $env:PACKAGE_VERSION
      # Linux: tar.gz + AppImage; macOS: .app zip + dmg
      - name: Publish and package
        if: runner.os != 'Windows'
        shell: bash
        run: OUT=artifacts/publish VERSION="$PACKAGE_VERSION" bash build/publish.sh --aot --package ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSharp-aot-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSharp-aot-${{ matrix.rid }}-packages
          path: artifacts/publish/packages
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSharp-aot-${{ matrix.rid }}-symbols
          path: artifacts/publish/${{ matrix.rid }}-symbols
          if-no-files-found: ignore

  # TODO android-arm64: an APK job (`dotnet build src/VitaSharp.Android -c Release -r android-arm64` after
  # `dotnet workload install maui-android`, plus the Android SDK/NDK and build/build-android-shaderc.sh), uploading
  # VitaSharp-android-arm64-packages holding VitaSharp-<version>-android-arm64.apk, which release.yml then collects
  # like the others.
