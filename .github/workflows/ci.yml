name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # FFmpeg shared libraries downloaded by build/FFmpeg.targets (none on macOS: it uses the system FFmpeg)
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/FFmpeg.targets') }}

      - name: Restore
        run: dotnet restore VitaSharp.sln

      - name: Build
        run: dotnet build VitaSharp.sln -c Release --no-restore

      # The CPU fuzz tests compare against Unicorn; its package has no osx-arm64 native library, so on
      # macos-latest (Apple Silicon) they report as skipped instead of failing.
      - name: Test
        run: dotnet test tests/VitaSharp.Tests -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results

  # Self-contained single-file builds for every platform, cross-published from one Linux runner.
  publish:
    name: Publish (${{ matrix.rid }})
    needs: build-test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-publish-${{ matrix.rid }}-${{ hashFiles('build/FFmpeg.targets') }}
      - name: Publish
        run: OUT=artifacts/publish bash build/publish.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: VitaSharp-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}
