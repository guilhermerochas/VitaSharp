<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controles · VitaSharp Android</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#05070A}
a{color:#8FB2FF}a:hover{color:#B7CCFF}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1116; color: #E8ECF2; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 12px; padding: 16px 20px 8px 16px">
    <a href="biblioteca.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 14px; background: #171B22; border: 1px solid #2A313D; color: #E8ECF2; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font: 700 22px Sora, sans-serif">Controles</h1>
  </header>

  <div style="padding: 8px 20px 0 20px; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; align-items: center; gap: 12px; background: #171B22; border-radius: 18px; padding: 14px 16px">
      <span style="width: 10px; height: 10px; border-radius: 999px; background: #8FB2FF; flex-shrink: 0"></span>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font: 600 14px Inter, sans-serif">DualSense Wireless Controller</span>
        <span style="font-size: 12px; color: #9AA4B2">Bluetooth · mapeado automaticamente</span>
      </div>
      <button style="height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid #2A313D; background: transparent; color: #C9D1DC; font: 500 12px Inter, sans-serif">Trocar</button>
    </div>

    <figure style="margin: 0; background: #12161C; border: 1px solid #222935; border-radius: 24px; padding: 18px 10px 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px">
      <svg width="350" height="170" viewBox="0 0 350 170" role="img" aria-label="Layout do PS Vita: Cruz pressionado, analógico esquerdo inclinado para cima e à direita">
        <rect x="70" y="2" width="56" height="12" rx="6" fill="#2A313D"></rect>
        <rect x="224" y="2" width="56" height="12" rx="6" fill="#6E9BFF"></rect>
        <text x="98" y="11" text-anchor="middle" font-family="Inter" font-size="8" font-weight="600" fill="#C9D1DC">L</text>
        <text x="252" y="11" text-anchor="middle" font-family="Inter" font-size="8" font-weight="700" fill="#0B1220">R</text>
        <rect x="6" y="18" width="338" height="146" rx="62" fill="#1B212B" stroke="#2E3644" stroke-width="1.5"></rect>
        <rect x="104" y="30" width="142" height="80" rx="8" fill="#0B0E13" stroke="#2E3644"></rect>
        <text x="175" y="74" text-anchor="middle" font-family="Inter" font-size="9" fill="#6B7584">Toque frontal</text>
        <g fill="#2A313D">
          <rect x="48" y="44" width="14" height="44" rx="3"></rect>
          <rect x="33" y="59" width="44" height="14" rx="3"></rect>
        </g>
        <g fill="none" stroke-width="2.2">
          <circle cx="294" cy="46" r="9" stroke="#2E3644" fill="#232A35"></circle>
          <path d="M294 41.5l4 7h-8z" stroke="#9AA4B2"></path>
          <circle cx="314" cy="66" r="9" stroke="#2E3644" fill="#232A35"></circle>
          <circle cx="314" cy="66" r="4" stroke="#9AA4B2"></circle>
          <circle cx="294" cy="86" r="10" stroke="#8FB2FF" fill="#6E9BFF"></circle>
          <path d="M290.5 82.5l7 7M297.5 82.5l-7 7" stroke="#0B1220"></path>
          <circle cx="274" cy="66" r="9" stroke="#2E3644" fill="#232A35"></circle>
          <rect x="270.5" y="62.5" width="7" height="7" stroke="#9AA4B2"></rect>
        </g>
        <circle cx="74" cy="124" r="20" fill="#232A35" stroke="#2E3644"></circle>
        <circle cx="74" cy="124" r="7" fill="none" stroke="#3A4352" stroke-dasharray="2 2"></circle>
        <circle cx="83" cy="116" r="8" fill="#6E9BFF"></circle>
        <circle cx="276" cy="124" r="20" fill="#232A35" stroke="#2E3644"></circle>
        <circle cx="276" cy="124" r="7" fill="none" stroke="#3A4352" stroke-dasharray="2 2"></circle>
        <circle cx="276" cy="124" r="8" fill="#5A6475"></circle>
        <rect x="138" y="126" width="22" height="7" rx="3.5" fill="#2A313D"></rect>
        <rect x="190" y="126" width="22" height="7" rx="3.5" fill="#2A313D"></rect>
        <circle cx="175" cy="129" r="7" fill="#2A313D"></circle>
        <text x="149" y="146" text-anchor="middle" font-family="Inter" font-size="7" fill="#6B7584">SELECT</text>
        <text x="201" y="146" text-anchor="middle" font-family="Inter" font-size="7" fill="#6B7584">START</text>
      </svg>
      <figcaption style="font-size: 12px; color: #9AA4B2">Pressione um botão para testar</figcaption>
    </figure>

    <section aria-label="Mapeamento" style="background: #171B22; border-radius: 18px; overflow: hidden">
      
        <button style="width: 100%; height: 50px; padding: 0 16px; border: none; border-bottom: 1px solid #232A35; background: #1E2A40; color: #E8ECF2; display: flex; align-items: center; justify-content: space-between; font: 500 14px Inter, sans-serif">
          <span>Cruz</span>
          <span style="height: 28px; padding: 0 10px; border-radius: 9px; background: #232A35; color: #C9D1DC; font: 600 12px Inter, sans-serif; display: flex; align-items: center">Botão sul · A</span>
        </button>
      
        <button style="width: 100%; height: 50px; padding: 0 16px; border: none; border-bottom: 1px solid #232A35; background: transparent; color: #E8ECF2; display: flex; align-items: center; justify-content: space-between; font: 500 14px Inter, sans-serif">
          <span>Círculo</span>
          <span style="height: 28px; padding: 0 10px; border-radius: 9px; background: #232A35; color: #C9D1DC; font: 600 12px Inter, sans-serif; display: flex; align-items: center">Botão leste · B</span>
        </button>
      
        <button style="width: 100%; height: 50px; padding: 0 16px; border: none; border-bottom: 1px solid #232A35; background: transparent; color: #E8ECF2; display: flex; align-items: center; justify-content: space-between; font: 500 14px Inter, sans-serif">
          <span>Quadrado</span>
          <span style="height: 28px; padding: 0 10px; border-radius: 9px; background: #232A35; color: #C9D1DC; font: 600 12px Inter, sans-serif; display: flex; align-items: center">Botão oeste · X</span>
        </button>
      
        <button style="width: 100%; height: 50px; padding: 0 16px; border: none; border-bottom: 1px solid #232A35; background: transparent; color: #E8ECF2; display: flex; align-items: center; justify-content: space-between; font: 500 14px Inter, sans-serif">
          <span>Triângulo</span>
          <span style="height: 28px; padding: 0 10px; border-radius: 9px; background: #232A35; color: #C9D1DC; font: 600 12px Inter, sans-serif; display: flex; align-items: center">Botão norte · Y</span>
        </button>
      
        <button style="width: 100%; height: 50px; padding: 0 16px; border: none; border-bottom: 1px solid #232A35; background: transparent; color: #E8ECF2; display: flex; align-items: center; justify-content: space-between; font: 500 14px Inter, sans-serif">
          <span>Toque traseiro</span>
          <span style="height: 28px; padding: 0 10px; border-radius: 9px; background: #232A35; color: #C9D1DC; font: 600 12px Inter, sans-serif; display: flex; align-items: center">L2 + analógico direito</span>
        </button>
      
    </section>

    <section aria-label="Ajustes do analógico" style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; font-size: 13px"><label for="dz">Zona morta</label><span style="color: #9AA4B2">12%</span></div>
        <input id="dz" type="range" min="0" max="40" value="12" style="width: 100%; accent-color: #6E9BFF">
      </div>
      <label style="display: flex; align-items: center; justify-content: space-between; font: 500 14px Inter, sans-serif">
        <span>Trocar botão de confirmar (O / X)</span>
        <span style="width: 46px; height: 28px; border-radius: 999px; background: #2A313D; position: relative; display: block"><span style="position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 999px; background: #9AA4B2; display: block"></span></span>
        <input type="checkbox" style="position: absolute; left: -9999px">
      </label>
    </section>

    <button style="height: 48px; border-radius: 16px; border: 1px solid #2A313D; background: transparent; color: #C9D1DC; font: 500 14px Inter, sans-serif">Restaurar padrão</button>
  </div>
</div>
</body>
</html>
