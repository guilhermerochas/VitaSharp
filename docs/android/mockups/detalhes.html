<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detalhes do jogo · VitaSharp Android</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#05070A}
a{color:#8FB2FF}a:hover{color:#B7CCFF}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1116; color: #E8ECF2; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 180px; flex-shrink: 0; background: #34405C; position: relative; display: flex; align-items: flex-end; padding: 20px; box-sizing: border-box">
    <a href="biblioteca.html" aria-label="Voltar" style="position: absolute; top: 16px; left: 16px; width: 44px; height: 44px; border-radius: 14px; background: rgba(9,12,18,0.6); color: #E8ECF2; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="position: absolute; top: 28px; right: 20px; font-size: 11px; color: #C4CEE2; letter-spacing: 0.08em; text-transform: uppercase">[Capa do jogo]</span>
    <span style="font: 700 56px Sora, sans-serif; color: #DCE5F7; opacity: 0.9">KZ</span>
  </div>

  <div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; flex: 1">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font: 700 24px Sora, sans-serif">Killzone Mercenary</h1>
      <span style="font-size: 13px; color: #9AA4B2">PCSC00045 · v1.12 · 3,2 GB</span>
    </div>

    <div style="display: flex; gap: 10px">
      <button style="flex: 1; height: 54px; border-radius: 18px; border: none; background: #6E9BFF; color: #0B1220; font: 600 16px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
        Jogar
      </button>
      <button aria-label="Mais opções" style="width: 54px; height: 54px; border-radius: 18px; border: 1px solid #2A313D; background: #171B22; color: #E8ECF2; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <div style="background: #171B22; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 11px; color: #9AA4B2">Tempo jogado</span>
        <span style="font: 600 16px Sora, sans-serif">12h 40m</span>
      </div>
      <div style="background: #171B22; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 11px; color: #9AA4B2">FPS médio</span>
        <span style="font: 600 16px Sora, sans-serif">30</span>
      </div>
      <div style="background: #171B22; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 11px; color: #9AA4B2">Último</span>
        <span style="font: 600 16px Sora, sans-serif">Ontem</span>
      </div>
    </div>

    <a href="trofeus.html" aria-label="Troféus: 18 de 48" style="text-decoration: none; color: inherit; background: #171B22; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E2B13C" stroke-width="1.8" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8M10 17h4"></path></svg>
        <span style="flex: 1; font: 600 15px Sora, sans-serif">Troféus</span>
        <span style="font: 600 13px Inter, sans-serif">18 / 48</span>
        <span style="font-size: 13px; color: #8FB2FF">37%</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7584" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
      <div style="height: 6px; border-radius: 999px; background: #232A35; overflow: hidden"><div style="width: 37%; height: 100%; background: #6E9BFF; border-radius: 999px"></div></div>
      <div style="display: flex; gap: 14px; font-size: 12px; color: #9AA4B2">
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #A9C4E8"></span>0/1</span>
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #E2B13C"></span>1/4</span>
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #C3C7CE"></span>5/11</span>
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #C07A44"></span>12/32</span>
      </div>
    </a>

    <section style="display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0 0 6px 0; font: 600 15px Sora, sans-serif">Configurações deste jogo</h2>
      <div style="background: #171B22; border-radius: 18px; overflow: hidden">
        <button style="width: 100%; height: 56px; padding: 0 16px; border: none; background: transparent; color: #E8ECF2; display: flex; align-items: center; justify-content: space-between; font: 500 14px Inter, sans-serif; border-bottom: 1px solid #232A35">
          <span>CPU</span><span style="color: #9AA4B2; display: flex; align-items: center; gap: 6px">Nativo (ARM64) <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
        </button>
        <button style="width: 100%; height: 56px; padding: 0 16px; border: none; background: transparent; color: #E8ECF2; display: flex; align-items: center; justify-content: space-between; font: 500 14px Inter, sans-serif; border-bottom: 1px solid #232A35">
          <span>Resolução</span><span style="color: #9AA4B2; display: flex; align-items: center; gap: 6px">2× (1920×1088) <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
        </button>
        <label style="height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font: 500 14px Inter, sans-serif; border-bottom: 1px solid #232A35">
          <span>VSync</span>
          <span style="width: 46px; height: 28px; border-radius: 999px; background: #6E9BFF; position: relative; display: block"><span style="position: absolute; right: 3px; top: 3px; width: 22px; height: 22px; border-radius: 999px; background: #0B1220; display: block"></span></span>
          <input type="checkbox" checked style="position: absolute; left: -9999px">
        </label>
        <label style="height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font: 500 14px Inter, sans-serif">
          <span>Mostrar FPS</span>
          <span style="width: 46px; height: 28px; border-radius: 999px; background: #2A313D; position: relative; display: block"><span style="position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 999px; background: #9AA4B2; display: block"></span></span>
          <input type="checkbox" style="position: absolute; left: -9999px">
        </label>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0 0 6px 0; font: 600 15px Sora, sans-serif">Saves</h2>
      <div style="background: #171B22; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font: 500 14px Inter, sans-serif">Campanha · Contrato 3</span>
          <span style="font-size: 12px; color: #9AA4B2">Salvo ontem às 22:14</span>
        </div>
        <button style="height: 36px; padding: 0 14px; border-radius: 12px; border: 1px solid #2A313D; background: transparent; color: #C9D1DC; font: 500 13px Inter, sans-serif">Exportar</button>
      </div>
    </section>
  </div>
</div>
</body>
</html>
