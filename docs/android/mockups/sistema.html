<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema do Vita · VitaSharp Android</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#05070A}
a{color:#8FB2FF}a:hover{color:#B7CCFF}
</style>
</head>
<body>
<div style="width: 844px; height: 390px; box-sizing: border-box; background: #050608; color: #E8ECF2; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">

  <!-- the emulator's output: the firmware's own shell.self, never drawn by the app -->
  <div role="img" aria-label="Saída do emulador: o shell.self do firmware" style="position: absolute; left: 78px; top: 0; width: 688px; height: 390px; background: #1D2233; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
    <span style="font-size: 12px; color: #8590A8; letter-spacing: 0.08em; text-transform: uppercase">[Tela do shell.self do firmware · 960×544 escalada]</span>
    <span style="font-size: 12px; color: #6B7590">tela inicial, LiveArea e apps do sistema reais, desenhados pelo emulador</span>
  </div>

  <a href="biblioteca.html" aria-label="Sair do Sistema do Vita" style="position: absolute; top: 14px; left: 17px; width: 44px; height: 44px; border-radius: 14px; background: rgba(9,12,18,0.6); border: 1px solid rgba(255,255,255,0.14); color: #E8ECF2; display: flex; align-items: center; justify-content: center">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </a>

  <div style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px">
    <span style="height: 26px; padding: 0 10px; border-radius: 9px; background: rgba(9,12,18,0.6); font: 600 12px Inter, sans-serif; color: #C9D1DC; display: flex; align-items: center">Sistema do Vita · firmware 3.74</span>
    <span style="height: 26px; padding: 0 10px; border-radius: 9px; background: rgba(9,12,18,0.6); font: 600 12px Inter, sans-serif; color: #8FB2FF; display: flex; align-items: center">60 FPS</span>
  </div>

  <button aria-label="Botão PS" style="position: absolute; left: 11px; bottom: 26px; width: 56px; height: 56px; border-radius: 999px; background: rgba(110,155,255,0.18); border: 1.5px solid rgba(143,178,255,0.75); color: #DCE5F7; font: 700 15px Sora, sans-serif; display: flex; align-items: center; justify-content: center">PS</button>

  <button aria-label="Mostrar controles na tela" style="position: absolute; right: 17px; bottom: 32px; width: 44px; height: 44px; border-radius: 14px; background: rgba(9,12,18,0.6); border: 1px solid rgba(255,255,255,0.14); color: #C9D1DC; display: flex; align-items: center; justify-content: center">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5.5"></rect><path d="M7 10.5v4M5 12.5h4"></path><circle cx="16" cy="11.5" r="1"></circle><circle cx="18.5" cy="13.5" r="1"></circle></svg>
  </button>
  <button aria-label="Menu" style="position: absolute; right: 17px; top: 14px; width: 44px; height: 44px; border-radius: 14px; background: rgba(9,12,18,0.6); border: 1px solid rgba(255,255,255,0.14); color: #C9D1DC; display: flex; align-items: center; justify-content: center">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg>
  </button>

  <div style="position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); height: 32px; padding: 0 14px; border-radius: 999px; background: rgba(9,12,18,0.72); border: 1px solid rgba(255,255,255,0.12); font: 500 12px Inter, sans-serif; color: #C9D1DC; display: flex; align-items: center; gap: 8px; white-space: nowrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8FB2FF" stroke-width="2" aria-hidden="true"><path d="M9 11V5a2 2 0 0 1 4 0v6M13 10a2 2 0 0 1 4 0v3a7 7 0 0 1-7 7 6 6 0 0 1-5-3l-2-4a1.6 1.6 0 0 1 2.7-1.6L9 13"></path></svg>
    Toque na imagem = tela de toque frontal · PS volta à tela inicial
  </div>
</div>
</body>
</html>
