<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogo com controles na tela · VitaSharp Android</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#05070A}
a{color:#8FB2FF}a:hover{color:#B7CCFF}
</style>
</head>
<body>
<div style="width: 844px; height: 390px; box-sizing: border-box; background: #050608; color: #E8ECF2; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">

  <div style="position: absolute; left: 78px; top: 0; width: 688px; height: 390px; background: #1E2722; display: flex; align-items: center; justify-content: center">
    <span style="font-size: 12px; color: #7F8B86; letter-spacing: 0.08em; text-transform: uppercase">[Tela do jogo · 960×544 escalada]</span>
  </div>

  <div role="status" aria-label="Troféu desbloqueado" style="position: absolute; top: 58px; left: 378px; width: 270px; height: 58px; box-sizing: border-box; padding: 8px 12px 8px 8px; border-radius: 16px; background: rgba(14,17,22,0.92); border: 1px solid #2B3A55; box-shadow: 0 8px 20px rgba(0,0,0,0.45); display: flex; align-items: center; gap: 10px">
    <span style="width: 42px; height: 42px; border-radius: 11px; background: #4A3E22; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E2B13C" stroke-width="1.8" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8M10 17h4"></path></svg></span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
      <span style="font-size: 11px; color: #9AA4B2">Troféu desbloqueado</span>
      <span style="font: 600 14px Inter, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Atirador de elite</span>
    </span>
    <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: rgba(226,177,60,0.16); color: #E2B13C; font: 600 11px Inter, sans-serif; display: flex; align-items: center">Ouro</span>
  </div>

  <div style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px">
    <span style="height: 26px; padding: 0 10px; border-radius: 9px; background: rgba(9,12,18,0.6); font: 600 12px Inter, sans-serif; color: #8FB2FF; display: flex; align-items: center">30 FPS</span>
    <a href="pausa.html" aria-label="Pausar e abrir menu" style="width: 40px; height: 32px; border-radius: 11px; background: rgba(9,12,18,0.6); border: 1px solid rgba(255,255,255,0.14); color: #E8ECF2; display: flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
    </a>
  </div>

  <button aria-label="L" style="position: absolute; top: 12px; left: 18px; width: 108px; height: 40px; border-radius: 14px 14px 10px 10px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.22); color: #E8ECF2; font: 600 14px Inter, sans-serif">L</button>
  <button aria-label="R" style="position: absolute; top: 12px; right: 18px; width: 108px; height: 40px; border-radius: 14px 14px 10px 10px; background: rgba(110,155,255,0.55); border: 1px solid rgba(143,178,255,0.9); color: #0B1220; font: 700 14px Inter, sans-serif">R</button>

  <div role="group" aria-label="Direcional" style="position: absolute; left: 30px; top: 92px; width: 120px; height: 120px">
    <button aria-label="Cima" style="position: absolute; left: 40px; top: 0; width: 40px; height: 44px; border-radius: 10px 10px 4px 4px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.22); color: #C9D1DC; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 6l7 10H5z"></path></svg></button>
    <button aria-label="Baixo" style="position: absolute; left: 40px; bottom: 0; width: 40px; height: 44px; border-radius: 4px 4px 10px 10px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.22); color: #C9D1DC; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 18L5 8h14z"></path></svg></button>
    <button aria-label="Esquerda" style="position: absolute; left: 0; top: 40px; width: 44px; height: 40px; border-radius: 10px 4px 4px 10px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.22); color: #C9D1DC; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 12l10-7v14z"></path></svg></button>
    <button aria-label="Direita" style="position: absolute; right: 0; top: 40px; width: 44px; height: 40px; border-radius: 4px 10px 10px 4px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.22); color: #C9D1DC; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 12L8 5v14z"></path></svg></button>
  </div>

  <div role="group" aria-label="Analógico esquerdo, inclinado para cima" style="position: absolute; left: 112px; top: 236px; width: 124px; height: 124px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.20)">
    <span style="position: absolute; left: 33px; top: 14px; width: 58px; height: 58px; border-radius: 999px; background: rgba(110,155,255,0.6); border: 1px solid rgba(143,178,255,0.95); display: block"></span>
  </div>

  <div role="group" aria-label="Botões de ação" style="position: absolute; right: 30px; top: 84px; width: 150px; height: 150px">
    <button aria-label="Triângulo" style="position: absolute; left: 50px; top: 0; width: 50px; height: 50px; border-radius: 999px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.22); color: #C9D1DC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5l7.5 13h-15z"></path></svg></button>
    <button aria-label="Quadrado" style="position: absolute; left: 0; top: 50px; width: 50px; height: 50px; border-radius: 999px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.22); color: #C9D1DC; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1"></rect></svg></button>
    <button aria-label="Círculo" style="position: absolute; right: 0; top: 50px; width: 50px; height: 50px; border-radius: 999px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.22); color: #C9D1DC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle></svg></button>
    <button aria-label="Cruz, pressionado" style="position: absolute; left: 50px; bottom: 0; width: 50px; height: 50px; border-radius: 999px; background: rgba(110,155,255,0.6); border: 1px solid rgba(143,178,255,0.95); color: #0B1220; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </div>

  <div role="group" aria-label="Analógico direito" style="position: absolute; right: 112px; top: 236px; width: 124px; height: 124px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.20)">
    <span style="position: absolute; left: 33px; top: 33px; width: 58px; height: 58px; border-radius: 999px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.26); display: block"></span>
  </div>

  <div style="position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px">
    <button style="height: 30px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.22); color: #C9D1DC; font: 600 11px Inter, sans-serif; letter-spacing: 0.06em">SELECT</button>
    <button aria-label="Botão PS" style="width: 30px; height: 30px; border-radius: 999px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.22); color: #C9D1DC; font: 700 10px Sora, sans-serif; display: flex; align-items: center; justify-content: center">PS</button>
    <button style="height: 30px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.22); color: #C9D1DC; font: 600 11px Inter, sans-serif; letter-spacing: 0.06em">START</button>
  </div>

  <button aria-label="Toque traseiro" style="position: absolute; left: 22px; bottom: 34px; width: 52px; height: 36px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px dashed rgba(255,255,255,0.28); color: #9AA4B2; font: 600 10px Inter, sans-serif">TRÁS</button>
</div>
</body>
</html>
